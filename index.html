<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>計算順序＋逆算ルール ランダム20問</title>
<style>
  :root { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
  body { margin:0; background:#f5f6f8; color:#111; }
  .wrap { max-width:760px; margin:auto; padding:16px; }
  h1 { font-size:24px; margin:4px 0 6px; }
  .sub { color:#555; font-size:14px; margin-bottom:12px; }
  .toprow { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button { font-size:18px; padding:12px 16px; border:1px solid #bbb; border-radius:12px; background:white; }
  button.primary { font-weight:700; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .stat { background:white; border-radius:14px; padding:10px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  .stat b { display:block; font-size:20px; }
  .stat span { font-size:12px; color:#666; }
  .card { background:white; border-radius:18px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .kind { display:inline-block; font-size:13px; color:#666; border:1px solid #ddd; border-radius:999px; padding:4px 9px; }
  .qno { font-size:14px; color:#666; margin-top:8px; }
  .expr { font-size:34px; font-weight:700; margin:18px 0; line-height:1.35; }
  .choices { display:grid; gap:10px; }
  .choice { text-align:left; width:100%; }
  .ok { background:#e9f7e9 !important; border-color:#79aa79 !important; }
  .ng { background:#fdeaea !important; border-color:#d77 !important; }
  .msg { min-height:46px; margin-top:14px; font-size:18px; font-weight:700; }
  .note { font-size:15px; font-weight:400; color:#555; margin-top:6px; }
  .footer { margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .summary { margin-top:14px; font-size:15px; color:#555; line-height:1.6; }
  .danger { font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ランダム20問トレーニング</h1>
  <div class="sub">計算順序と逆算ルールを混ぜて出題。計算そのものではなく「正しい手順・式」を選びます。</div>

  <div class="stats">
    <div class="stat"><b id="todayRate">—</b><span>今日の正答率</span></div>
    <div class="stat"><b id="bestRate">—</b><span>最高正答率</span></div>
    <div class="stat"><b id="streak">0日</b><span>連続実施</span></div>
  </div>

  <div class="toprow">
    <button id="start" class="primary">今日の20問を始める</button>
    <button id="newset">新しい20問</button>
  </div>

  <div class="card">
    <div id="kind" class="kind">待機中</div>
    <div id="qno" class="qno"></div>
    <div id="expr" class="expr">「今日の20問を始める」を押してください</div>
    <div id="choices" class="choices"></div>
    <div id="msg" class="msg"></div>
    <div class="footer">
      <button id="next" style="display:none">次へ</button>
    </div>
    <div id="summary" class="summary"></div>
  </div>
</div>

<script>
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const today=()=>new Date().toISOString().slice(0,10);

let qs=[], idx=0, correct=0, answered=false;
let orderCorrect=0, orderTotal=0, revCorrect=0, revTotal=0;
let dangerCorrect=0, dangerTotal=0;

function orderQuestion(){
  const t=rnd(1,7), a=rnd(2,24), b=rnd(2,12), c=rnd(2,12), d=rnd(2,9);
  let e,ans,w,n;
  if(t===1){
    e=`${a} ＋ ${b} × ${c}`;
    ans=`${b} × ${c} を先に計算`;
    w=[`${a} ＋ ${b} を先に計算`,`左から順に計算`,`${a} と ${c} を先に計算`];
    n="×・÷ は ＋・− より先。";
  } else if(t===2){
    e=`${a} − ${b} × ${c}`;
    ans=`${b} × ${c} を先に計算`;
    w=[`${a} − ${b} を先に計算`,`左から順に計算`,`${a} と ${c} を先に計算`];
    n="×・÷ は ＋・− より先。";
  } else if(t===3){
    e=`(${a} ＋ ${b}) × ${c}`;
    ans=`(${a} ＋ ${b}) を先に計算`;
    w=[`${b} × ${c} を先に計算`,`左から順に計算`,`${a} × ${c} を先に計算`];
    n="まず ( ) の中。";
  } else if(t===4){
    e=`${a} × (${b} ＋ ${c})`;
    ans=`(${b} ＋ ${c}) を先に計算`;
    w=[`${a} × ${b} を先に計算`,`左から順に計算`,`${a} ＋ ${c} を先に計算`];
    n="まず ( ) の中。";
  } else if(t===5){
    e=`${a*d} ÷ ${d} ＋ ${b} × ${c}`;
    ans="÷ と × を先に計算";
    w=["＋ を先に計算","左から全部順番に計算",`${b} ＋ ${c} を先に計算`];
    n="×・÷ を先に。";
  } else if(t===6){
    e=`(${a} − ${b}) ÷ ${d} ＋ ${c}`;
    ans=`(${a} − ${b}) を先に計算`;
    w=["÷ を先に計算","＋ を先に計算","左から順に計算"];
    n="最優先は ( ) の中。";
  } else {
    e=`${a} ＋ ${b} × (${c} − ${d})`;
    ans=`(${c} − ${d}) を先に計算`;
    w=[`${a} ＋ ${b} を先に計算`,`${b} × ${c} を先に計算`,`左から順に計算`];
    n="まず ( )。その後に ×・÷。";
  }
  return {kind:"計算順序",e,ans,cs:shuffle([ans,...w]),n,danger:false};
}

function reverseQuestion(){
  const t=rnd(1,10);
  let A,B,e,ans,w,n,danger=false;

  if(t<=3){ // A - □ = B
    B=rnd(2,30); const x=rnd(2,25); A=B+x;
    e=`${A} − □ ＝ ${B}`;
    ans=`□ ＝ ${A} − ${B}`;
    w=[`□ ＝ ${B} ＋ ${A}`,`□ ＝ ${B} − ${A}`,`□ ＝ ${A} ＋ ${B}`];
    n="要注意：□の左に「−」。A−□＝B なら □＝A−B。";
    danger=true;
  } else if(t<=6){ // A ÷ □ = B
    B=rnd(2,12); const x=rnd(2,12); A=B*x;
    e=`${A} ÷ □ ＝ ${B}`;
    ans=`□ ＝ ${A} ÷ ${B}`;
    w=[`□ ＝ ${B} × ${A}`,`□ ＝ ${A} × ${B}`,`□ ＝ ${B} ÷ ${A}`];
    n="要注意：□の左に「÷」。A÷□＝B なら □＝A÷B。";
    danger=true;
  } else if(t===7){ // □ - A = B
    A=rnd(2,25); B=rnd(2,30);
    e=`□ − ${A} ＝ ${B}`;
    ans=`□ ＝ ${B} ＋ ${A}`;
    w=[`□ ＝ ${B} − ${A}`,`□ ＝ ${A} − ${B}`,`□ ＝ ${A} ＋ ${B}`];
    n="□が先頭なら、引いた分を足して戻す。";
  } else if(t===8){ // □ ÷ A = B
    A=rnd(2,12); B=rnd(2,12);
    e=`□ ÷ ${A} ＝ ${B}`;
    ans=`□ ＝ ${B} × ${A}`;
    w=[`□ ＝ ${B} ÷ ${A}`,`□ ＝ ${A} ÷ ${B}`,`□ ＝ ${A} × ${B}`];
    n="□が先頭なら、割った数を掛けて戻す。";
  } else if(t===9){ // □ + A = B
    A=rnd(2,25); const x=rnd(2,30); B=A+x;
    e=`□ ＋ ${A} ＝ ${B}`;
    ans=`□ ＝ ${B} − ${A}`;
    w=[`□ ＝ ${B} ＋ ${A}`,`□ ＝ ${A} − ${B}`,`□ ＝ ${A} × ${B}`];
    n="足した分を引いて戻す。";
  } else { // □ × A = B
    A=rnd(2,12); const x=rnd(2,12); B=A*x;
    e=`□ × ${A} ＝ ${B}`;
    ans=`□ ＝ ${B} ÷ ${A}`;
    w=[`□ ＝ ${B} × ${A}`,`□ ＝ ${A} ÷ ${B}`,`□ ＝ ${A} ＋ ${B}`];
    n="掛けた数で割って戻す。";
  }
  return {kind:"逆算ルール",e,ans,cs:shuffle([ans,...w]),n,danger};
}

function makeSet(){
  const a=[];
  for(let i=0;i<10;i++) a.push(orderQuestion());
  for(let i=0;i<10;i++) a.push(reverseQuestion());
  return shuffle(a);
}

function startNew(){
  qs=makeSet(); idx=0; correct=0; answered=false;
  orderCorrect=orderTotal=revCorrect=revTotal=dangerCorrect=dangerTotal=0;
  document.getElementById("summary").innerHTML="";
  show();
}

function show(){
  answered=false;
  const q=qs[idx];
  kind.textContent=q.kind + (q.danger ? "・要注意型" : "");
  qno.textContent=`${idx+1} / ${qs.length}`;
  expr.textContent=q.e;
  msg.innerHTML="";
  choices.innerHTML="";
  next.style.display="none";
  q.cs.forEach(c=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=c;
    b.onclick=()=>answer(b,c);
    choices.appendChild(b);
  });
}

function answer(btn,c){
  if(answered) return;
  answered=true;
  const q=qs[idx];
  if(q.kind==="計算順序") orderTotal++; else revTotal++;
  if(q.danger) dangerTotal++;

  [...document.querySelectorAll(".choice")].forEach(b=>{
    if(b.textContent===q.ans) b.classList.add("ok");
  });

  if(c===q.ans){
    correct++;
    if(q.kind==="計算順序") orderCorrect++; else revCorrect++;
    if(q.danger) dangerCorrect++;
    msg.innerHTML=`○ 正解<div class="note">${q.n}</div>`;
  } else {
    btn.classList.add("ng");
    msg.innerHTML=`× ルールを確認<div class="note">${q.n}</div>`;
  }
  next.style.display="inline-block";
}

function finish(){
  const rate=Math.round(correct/qs.length*100);
  const oRate=orderTotal?Math.round(orderCorrect/orderTotal*100):0;
  const rRate=revTotal?Math.round(revCorrect/revTotal*100):0;
  const dRate=dangerTotal?Math.round(dangerCorrect/dangerTotal*100):0;

  saveResult(rate);

  kind.textContent="終了";
  qno.textContent="";
  expr.textContent=`${correct} / ${qs.length} 問正解`;
  choices.innerHTML="";
  msg.innerHTML = rate===100 ? "全問正解！" : "間違えた型は、明日もう一度。";
  summary.innerHTML = `
    計算順序：${orderCorrect}/${orderTotal}（${oRate}%）<br>
    逆算ルール：${revCorrect}/${revTotal}（${rRate}%）<br>
    <span class="danger">要注意型 A−□ / A÷□：${dangerCorrect}/${dangerTotal}（${dRate}%）</span>
  `;
  next.style.display="none";
  refreshStats();
}

function saveResult(rate){
  const d=today();
  const data=JSON.parse(localStorage.getItem("calcTrainerHistory")||"{}");
  data[d]=Math.max(data[d]||0,rate);
  localStorage.setItem("calcTrainerHistory",JSON.stringify(data));
}

function refreshStats(){
  const data=JSON.parse(localStorage.getItem("calcTrainerHistory")||"{}");
  const vals=Object.values(data);
  todayRate.textContent = data[today()]!==undefined ? data[today()]+"%" : "—";
  bestRate.textContent = vals.length ? Math.max(...vals)+"%" : "—";

  let s=0;
  const cur=new Date();
  while(true){
    const key=cur.toISOString().slice(0,10);
    if(data[key]===undefined) break;
    s++;
    cur.setDate(cur.getDate()-1);
  }
  streak.textContent=s+"日";
}

const kind=document.getElementById("kind"),
      qno=document.getElementById("qno"),
      expr=document.getElementById("expr"),
      choices=document.getElementById("choices"),
      msg=document.getElementById("msg"),
      next=document.getElementById("next"),
      start=document.getElementById("start"),
      newset=document.getElementById("newset"),
      summary=document.getElementById("summary"),
      todayRate=document.getElementById("todayRate"),
      bestRate=document.getElementById("bestRate"),
      streak=document.getElementById("streak");

next.onclick=()=>{ idx++; idx>=qs.length ? finish() : show(); };
start.onclick=startNew;
newset.onclick=startNew;

refreshStats();
</script>
</body>
</html>
